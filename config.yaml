behaviors:
  GFSX_Brain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.00025
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      # Constant, not linear: the staged success-gated curriculum has an emergent
      # (unknown) duration, so a schedule decaying to zero at max_steps would
      # freeze the hard late stages before they are reached (this is exactly how
      # run smoke3 ended - LR hit 0 while still stuck on the barrier stage).
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.005
        encoding_size: 128
        learning_rate: 0.0003
    keep_checkpoints: 5
    # Upper bound only. The 9-stage plateau-gated curriculum realistically needs
    # ~10-15M steps to reach the barrier stages; it stops progressing on its own
    # once the top stage plateaus, so surplus budget is simply unused.
    max_steps: 15000000
    time_horizon: 1000
    summary_freq: 20000

# No environment_parameters section on purpose: without an explicit
# arena_difficulty the scene runs its own success-gated curriculum
# (SuccessGatedCurriculum.cs) - difficulty rises only after a full
# 200-episode window with >=70% grabs and <=1 collision per episode.
# The reward-threshold variant lives on in config_progressive.yaml;
# config_hard_from_zero.yaml still forces a fixed difficulty of 1.0.
